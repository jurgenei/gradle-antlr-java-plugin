import name.jurgenei.gradle.antlr.XmlAstGradleTask

plugins {
    id 'java'
    id 'antlr'
    id 'java-gradle-plugin'
    id 'com.gradle.plugin-publish' version '1.3.1'
    id 'jacoco'
    id 'name.jurgenei.gradle.antlr' version '0.1.9'
    id 'maven-publish'
    id 'signing'
    id 'org.owasp.dependencycheck' version '10.0.3'
    id 'com.github.spotbugs' version '6.1.0'
}

group = 'name.jurgenei.gradle'
version = '0.1.0'

ext {
    spotbugsEngineVersion = '4.8.6'
    findSecBugsVersion = '1.13.0'
}

gradlePlugin {
    website = 'https://github.com/jurgenei/gradle-antlr-java-plugin'
    vcsUrl = 'https://github.com/jurgenei/gradle-antlr-java-plugin'
    plugins {
        xmlAstJava {
            id = 'name.jurgenei.gradle.antlr.java'
            implementationClass = 'name.jurgenei.gradle.antlr.XmlAstJavaPlugin'
            displayName = 'Gradle ANTLR Java Plugin'
            description = 'Preconfigured XML AST task support for Java grammar parsing.'
            tags.set(['antlr', 'xml', 'ast', 'java'])
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    implementation 'name.jurgenei.gradle:gradle-antlr-plugin:0.1.7'
    implementation 'org.antlr:antlr4-runtime:4.13.2'

    antlr 'org.antlr:antlr4:4.13.2'

    testImplementation gradleTestKit()
    testImplementation 'junit:junit:4.13.2'

    spotbugsPlugins "com.h3xstream.findsecbugs:findsecbugs-plugin:${findSecBugsVersion}"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'Gradle ANTLR Java Plugin'
                description = 'Gradle plugin for XML AST conversion of Java sources'
                url = 'https://github.com/jurgenei/gradle-antlr-java-plugin'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }

                developers {
                    developer {
                        id = 'jurgenei'
                        name = 'Jurgen Hildebrand'
                    }
                }

                scm {
                    connection = 'scm:git:https://github.com/jurgenei/gradle-antlr-java-plugin.git'
                    developerConnection = 'scm:git:ssh://git@github.com/jurgenei/gradle-antlr-java-plugin.git'
                    url = 'https://github.com/jurgenei/gradle-antlr-java-plugin'
                }
            }
        }
    }

    repositories {
        mavenLocal()
    }
}

signing {
    required = { gradle.taskGraph.hasTask('publish') }
    def signingKey = findProperty('signingKey')
    def signingPassword = findProperty('signingPassword')
    if (signingKey && signingPassword) {
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications.mavenJava
    }
}

dependencyCheck {
    format = 'HTML,JSON,XML'
    failBuildOnCVSS = 7.0
    suppressionFile = 'dependency-check-suppressions.xml'
    nvd {
        apiKey = findProperty('org.owasp.dependencycheck.nvd.api.key') ?: System.getenv('NVD_API_KEY')
    }
}

spotbugs {
    toolVersion = spotbugsEngineVersion
    ignoreFailures = false
    effort = com.github.spotbugs.snom.Effort.valueOf('DEFAULT')
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('MEDIUM')
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        html.required = true
        xml.required = false
    }
}

tasks.named('spotbugsMain', com.github.spotbugs.snom.SpotBugsTask) {
    excludeFilter = file('spotbugs-exclude.xml')
}

tasks.named('spotbugsTest', com.github.spotbugs.snom.SpotBugsTask) {
    enabled = false
}

def grammarDir = file('src/main/antlr/name/jurgenei/parsers')
def antlrOutputDir = file("$buildDir/generated-src/antlr/main")
tasks.register('generateLexerSources', JavaExec) {
    group = 'build'
    description = 'Generate ANTLR lexer sources for Java grammar.'
    classpath = configurations.antlr
    mainClass = 'org.antlr.v4.Tool'
    inputs.file(new File(grammarDir, 'JavaLexer.g4'))
    outputs.dir(antlrOutputDir)
    doFirst {
        antlrOutputDir.mkdirs()
    }
    args '-listener', '-no-visitor', '-Xexact-output-dir', '-o', antlrOutputDir.absolutePath,
            new File(grammarDir, 'JavaLexer.g4').absolutePath
}

tasks.register('generateParserSources', JavaExec) {
    group = 'build'
    description = 'Generate ANTLR parser/listener sources for Java grammar.'
    dependsOn tasks.named('generateLexerSources')
    classpath = configurations.antlr
    mainClass = 'org.antlr.v4.Tool'
    inputs.file(new File(grammarDir, 'JavaParser.g4'))
    outputs.dir(antlrOutputDir)
    doFirst {
        antlrOutputDir.mkdirs()
    }
    workingDir = antlrOutputDir
    args '-listener', '-no-visitor', '-Xexact-output-dir',
            '-lib', antlrOutputDir.absolutePath, '-o', antlrOutputDir.absolutePath,
            new File(grammarDir, 'JavaParser.g4').absolutePath
}

sourceSets {
    main {
        java {
            srcDir antlrOutputDir
        }
        resources {
            srcDir 'src/main/antlr'
            include '**/*.g4'
        }
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('generateParserSources')
}

tasks.named('generateGrammarSource') {
    enabled = false
}

tasks.named('sourcesJar', org.gradle.api.tasks.bundling.Jar) {
    dependsOn tasks.named('generateParserSources')
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE
}

tasks.register('verifyGrammarSources') {
    group = 'verification'
    description = 'Checks that Java grammar source files are present.'
    def requiredFiles = [
            file('src/main/antlr/name/jurgenei/parsers/JavaLexer.g4'),
            file('src/main/antlr/name/jurgenei/parsers/JavaParser.g4')
    ]
    inputs.files(requiredFiles)
    doLast {
        requiredFiles.each { f ->
            if (!f.isFile()) {
                throw new GradleException("Missing required grammar file: ${f.path}")
            }
        }
    }
}

tasks.register('verifyJarLayout') {
    group = 'verification'
    description = 'Verifies grammar jar contains Java parser classes and .g4 files.'
    dependsOn tasks.named('jar')
    def jarArchive = tasks.named('jar', org.gradle.api.tasks.bundling.Jar).flatMap { it.archiveFile }
    inputs.file(jarArchive)

    doLast {
        def jarFile = jarArchive.get().asFile
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            def entries = zip.entries().collect { it.name }
            def requiredEntries = [
                    'name/jurgenei/parsers/JavaLexer.g4',
                    'name/jurgenei/parsers/JavaParser.g4'
            ]
            requiredEntries.each { path ->
                if (!entries.contains(path)) {
                    throw new GradleException("Missing required jar entry: ${path} in ${jarFile.name}")
                }
            }
            if (!entries.any { it ==~ /name\/jurgenei\/parsers\/JavaLexer(\$.*)?\.class/ }) {
                throw new GradleException("Missing required lexer class entry under name/jurgenei/parsers in ${jarFile.name}")
            }
            if (!entries.any { it ==~ /name\/jurgenei\/parsers\/JavaParser(\$.*)?\.class/ }) {
                throw new GradleException("Missing required parser class entry under name/jurgenei/parsers in ${jarFile.name}")
            }
        } finally {
            zip.close()
        }
    }
}

def configureXmlAstTask = { XmlAstGradleTask taskRef ->
    taskRef.group = 'verification'
    taskRef.description = 'Parses Java grammar examples to XML AST.'
    taskRef.dependsOn tasks.named('classes')
    taskRef.grammar.set('java')
    taskRef.parserClassName.set('name.jurgenei.parsers.JavaParser')
    taskRef.lexerClassName.set('name.jurgenei.parsers.JavaLexer')
    taskRef.startRule.set('compilationunit')
    taskRef.sourceDirectory.set(layout.projectDirectory.dir('src/test/resources/examples'))
    taskRef.destinationDirectory.set(layout.buildDirectory.dir('xmlast-examples'))
    taskRef.includes.set(['**/*.java'])
    taskRef.targetExtension.set('.xml')
    taskRef.continueOnError.set(false)
    taskRef.runtimeClasspath.from(configurations.runtimeClasspath)
}

tasks.register('javaXmlAstExamples', XmlAstGradleTask) {
    configureXmlAstTask(delegate)
}

tasks.withType(Test).configureEach {
    useJUnit()
    dependsOn tasks.named('compileJava')
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('test') {
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    classDirectories.setFrom(files(sourceSets.main.output.classesDirs.asFileTree.matching {
        include 'name/jurgenei/gradle/antlr/**'
    }))
    sourceDirectories.setFrom(files(sourceSets.main.allSource.srcDirs))
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('jacocoTestReport')
    classDirectories.setFrom(files(sourceSets.main.output.classesDirs.asFileTree.matching {
        include 'name/jurgenei/gradle/antlr/**'
    }))
    sourceDirectories.setFrom(files(sourceSets.main.allSource.srcDirs))
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.60
            }
        }
    }
}

tasks.register('coverage') {
    group = 'verification'
    description = 'Runs tests, generates JaCoCo report, and verifies minimum coverage threshold.'
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

tasks.matching { it.name == 'publishPlugins' }.configureEach {
    notCompatibleWithConfigurationCache('publishPlugins uses Gradle Plugin Publish internals that are not configuration-cache serializable')
}

tasks.named('check') {
    dependsOn tasks.named('verifyGrammarSources')
    dependsOn tasks.named('verifyJarLayout')
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

tasks.register('allSecurityChecks') {
    group = 'verification'
    description = 'Run dependency and static analysis checks.'
    dependsOn tasks.named('check')
    def dependencyCheckTask = tasks.findByName('dependencyCheck') ?: tasks.findByName('dependencyCheckAnalyze')
    if (dependencyCheckTask != null) {
        dependsOn dependencyCheckTask
    }
    dependsOn tasks.named('spotbugsMain')
}
